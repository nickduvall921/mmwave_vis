name: "Inovelli mmWave Visualizer"
description: "Live 2D tracking for Inovelli mmWave switches via MQTT-Z2M or ZHA"
version: "4.2.1"
slug: "mmwave_viz"
init: false
arch:
  - aarch64
  - amd64
map:
  - config:rw
  # /ssl holds certificates (e.g. a CA for mqtt_tls_ca_cert)
  - ssl:ro
hassio_api: true
hassio_role: default
homeassistant_api: true
# The optional history database can be tens of MB and is rebuilt as it records;
# layouts, zone names and settings in /data are still backed up.
backup_exclude:
  - "history.db*"
options:
  zigbee_stack: "z2m"
  debug: false
  mqtt_broker: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_base_topic: "zigbee2mqtt"
  mqtt_use_tls: false
  mqtt_tls_insecure: false
  mqtt_tls_ca_cert: ""
  ha_url: "http://supervisor"
  ha_token: ""
schema:
  zigbee_stack: str
  debug: bool
  mqtt_broker: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
  mqtt_base_topic: str
  mqtt_use_tls: bool
  mqtt_tls_insecure: bool
  mqtt_tls_ca_cert: str
  ha_url: str
  ha_token: str

ingress: true
ingress_port: 5000
panel_icon: mdi:radar
panel_title: "mmWave Radar"